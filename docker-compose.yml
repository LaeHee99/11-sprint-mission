services:
  # PostgreSQL 데이터베이스 컨테이너임
  # 애플리케이션이 prod profile에서 사용할 DB 역할임
  postgres:
    image: postgres:17-alpine
    container_name: discodeit-postgres

    # PostgreSQL 컨테이너 최초 실행 시 사용할 기본 DB/계정 설정임
    # POSTGRES_DB 이름으로 DB가 생성됨
    # POSTGRES_USER 이름으로 사용자 생성됨
    # POSTGRES_PASSWORD 값이 해당 사용자의 비밀번호가 됨
    environment:
      POSTGRES_DB: discodeit
      POSTGRES_USER: discodeit_user
      POSTGRES_PASSWORD: discodeit1234

    # 호스트 5432 포트를 컨테이너 5432 포트와 연결함
    # 로컬 DB 툴에서 localhost:5432로 접근 가능하게 하기 위함
    ports:
      - "5432:5432"

    # postgres_data는 DB 데이터를 유지하기 위한 named volume임
    # schema.sql은 컨테이너 최초 초기화 시 자동 실행되는 SQL 파일임
    # :ro는 컨테이너에서 읽기 전용으로 마운트한다는 뜻임
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  # Discodeit Spring Boot 애플리케이션 컨테이너임
  # 현재 프로젝트 루트의 Dockerfile을 사용해서 이미지 빌드함
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: discodeit-app

    # postgres 서비스가 먼저 시작된 뒤 app 서비스가 시작되도록 설정함
    # DB가 완전히 준비될 때까지 기다리는 기능은 아님
    depends_on:
      - postgres

    # Spring Boot prod profile 실행에 필요한 환경 변수임
    # application-prod.yaml에서 ${...} 형태로 참조하는 값들을 여기서 주입함
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/discodeit
      SPRING_DATASOURCE_USERNAME: discodeit_user
      SPRING_DATASOURCE_PASSWORD: discodeit1234

      # BinaryContentStorage를 로컬 파일 저장 방식으로 사용함
      # 컨테이너 내부 /app/.discodeit/storage 경로에 파일 저장함
      STORAGE_TYPE: local
      STORAGE_LOCAL_ROOT_PATH: /app/.discodeit/storage

      # JVM 옵션을 외부에서 조정할 수 있도록 둠
      # 현재는 빈 문자열 사용함
      JVM_OPTS: ""

    # 호스트 8081 포트를 컨테이너 80 포트와 연결함
    # 브라우저에서 http://localhost:8081 로 접속 가능함
    ports:
      - "8081:80"

    # 업로드 파일 저장소를 named volume으로 연결함
    # 컨테이너를 재시작해도 BinaryContentStorage 데이터 유지됨
    volumes:
      - binary_storage:/app/.discodeit/storage

# Docker가 관리하는 named volume 정의임
# 컨테이너를 삭제해도 volume을 삭제하지 않으면 데이터 유지됨
volumes:
  postgres_data:
  binary_storage: